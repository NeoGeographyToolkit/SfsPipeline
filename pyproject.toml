[build-system]
requires = ["setuptools>=62.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loony"
description = "Ames Stereo Pipeline SfS tools"
requires-python = ">=3.12"
dynamic = ["version", "readme"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
authors = [
    {name = "Dr. Andrew Annex", email="andrew.m.annex@nasa.gov"}
]
keywords = ["SfS", "Tools"]
dependencies = [
    "sh",
    "rasterio",
    "duckdb",
    "fiona",
    "pyproj",
    "geopandas",
    "polars",
    "fire",
    "shapely",
    "numpy",
    "pyarrow"
]

[project.urls]
Repository = "https://github.com/NeoGeographyToolkit/SfsPipeline.git"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "loony.__version__"}
readme = {file = "README.md"}

[tool.setuptools.package-data]
"*" = ["*.xml"]


[project.scripts]
get-current-provenance           = "loony.get_current_provenance:main"
preprocess-cumulative-index      = "loony.process_lroc_cumulative_index:main"
process-cumulative-index         = "loony.resources.process:main"
find-overlaps-for-bundle-adjust  = "loony.find_overlaps_for_bundle_adjust:main"
sfs-cover                        = "loony.new_sfs_cover:main"
find-stereo-pairs                = "loony.find_stereo_pairs:main"
wkt-to-ullr                      = "loony.wkt_to_ullr:main"
wkt-to-projwin                   = "loony.wkt_to_projwin:main"
wkt-round-out                    = "loony.wkt_round_out:main"
setops                           = "loony.setops:main"
tri-plot                         = "loony.triangulation_plot:main"
verify-bundle-adjust             = "loony.verify_bundle_adjust:main"
get-stereo-from-ba               = "loony.get_stereo_pairs_from_bundle_adjust:main"
solar-az-plot                    = "loony.solar_az_animate:main"
lit-select                       = "loony.lit_select:main"
update-db-from-footprints        = "loony.update_db_from_footprints:main"
filter-db-by-verify-ba           = "loony.filter_db_by_verify_ba:main"