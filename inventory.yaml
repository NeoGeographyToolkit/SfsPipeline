# This is an example of what we're calling an "inventory" file for 
# an SfS project.  The goal of this file is to be placed in an SfS
# project directory (typically on pleiades) when work on the project is finished.
# Thus every project will have an inventory.yaml that someone can look at
# and learn about the key data produced and the important information relevant
# to the creation of the data from notes to command line switches, etc.
#
# This inventory file documents the relevant files in the project directory
# that will be gathered up and delivered.  It also serves as a kind of final
# report of program flags used or choices made during processing which resulted
# in the files being pointed at.
#
# Beyond just these YAML items, please also use the comments to be as verbose
# as possible about issues encountered caveats, known artifacts in the data,
# etc.

# The DEM used to start the process. For the Moon, this is typically
# going to be some form of LOLA that has been modified to be at the
# ground scale distance of the desired final product.
base_terrain_path: path/to/lola_improved.tif

# Final bundle-adjust (or jitter) prefix. The adjusted CSM camera .json files
# under this prefix (one per image, the linear-reduced set) are delivered
# alongside the DEM and orthoimages.
final_bundle_adjust_prefix: path/to/ba_dir

# Any stereo models made (individual or merged) that we want to share:
stereo_dems:
  - path/to/dem1.tif
  - path/to/dem2.tif

# Final output terrain model
sfs_terrain_path: path/to/sfs.tif

# This could be the path to the logfile that records all of the 
# command line entries that produced the sfs_terrain_path
sfs_terrain_log: path/to/sfs.log
# or sfs_terrain_log: >-
#  This is where the description of the command line used 
#  to produce the terrain model can be provided, but the path
#  to a log file is preferred which will also contain this 
#  information.

sfs_blend_terrain_path: path/to/sfs_blend.tif

sfs_blend_terrain_log: path/to/sfs.log
# or sfs_blend_terrain_log: >-
#  This is where the description of the command line used 
#  to produce the terrain model can be provided, but the path
#  to a log file is preferred which will also contain this 
#  information.

sfs_blend_weight_path: path/to/weight.tif

sfs_height_error_path: path/to/height_error.tif

# Max-lit ortho mosaic (brightest pixel per location). The matching orthoimage
# shipped with the DEM, the sfs_blend input, and the best view for spotting
# shadow coverage and camera-registration smears.
max_lit_path: path/to/maxlit.tif

# Average (blend) ortho mosaic: a seamless grassfire blend of the mapprojected
# images with shadow pixels masked. An additional product shipped as well as the
# max-lit one (customer request).
avg_mosaic_path: path/to/average_mosaic.tif

# Image-id lists. Two lists ship as text, even when only the SfS subset is
# delivered as images and cameras: the bundle-adjust list documents the larger
# input set, the SfS list is the subset actually used (and shipped).
# ba_image_ids: every image that went into the final bundle adjust / jitter solve.
# sfs_image_ids: the subset used for Shape-from-Shading (a subset of ba_image_ids).
ba_image_ids_path: path/to/bundle_adjust_image_ids.txt
sfs_image_ids_path: path/to/sfs_image_ids.txt

# Orthoimages are delivered as TWO directories (every *.tif in each is an ortho):
# the 1 m/pixel set, and the native-GSD ("natural") set with each image at its
# own best resolution plus a CSV listing the per-image GSD.
orthophoto_dir_1mpp: path/to/LROC-NAC-maps-1mpp
orthophoto_dir_natural: path/to/LROC-NAC-maps-natural
orthophoto_natural_gsd_csv: path/to/LROC-NAC-maps-natural/gsd.csv

# If you use this, provide some comment here about how you used it.
orthophoto_postfix: optional string
